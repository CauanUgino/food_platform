{% extends "base.html" %}
{% block content %}

<h1>Categorias</h1>

<a href="{% url 'category_create' %}">➕ Nova categoria</a>

<ul>
  {% for category in categories %}
    <li>
      {{ category.name }}
      | <a href="{% url 'category_edit' category.id %}">Editar</a>
      | <a href="{% url 'category_delete' category.id %}">Excluir</a>
    </li>
  {% empty %}
    <li>Nenhuma categoria cadastrada</li>
  {% endfor %}
</ul>

{% endblock %}
