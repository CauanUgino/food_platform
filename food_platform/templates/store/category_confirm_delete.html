{% extends "base.html" %}

{% block content %}
  <h1>Excluir Categoria</h1>
  <p>Tem certeza que deseja excluir a categoria "{{ category.name }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Sim, excluir</button>
    <a href="{% url 'category_list' %}">Cancelar</a>
  </form>
{% endblock %}
