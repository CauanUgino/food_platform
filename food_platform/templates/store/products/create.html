{% extends "base.html" %}

{% block content %}
<h1>Novo Produto</h1>

<form method="post">
  {% csrf_token %}

  <input name="name" placeholder="Nome do produto" required><br><br>

  <textarea name="description" placeholder="Descrição"></textarea><br><br>

  <input name="price" type="number" step="0.01" placeholder="Preço" required><br><br>

  <select name="category" required>
    <option value="">Selecione a categoria</option>
    {% for cat in categories %}
      <option value="{{ cat.id }}">{{ cat.name }}</option>
    {% endfor %}
  </select><br><br>

  <button type="submit">Salvar</button>
</form>
{% endblock %}
