{% if role == "OWNER" %}
<div class="card border-0 shadow-sm rounded-5 p-4 p-md-5 mb-5">
    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="bg-warning p-2 rounded-3 text-white">
            <i class="bi bi-shield-lock fs-4"></i>
        </div>
        <div>
            <h4 class="fw-800 mb-0">Área do Proprietário</h4>
            <p class="text-muted small mb-0">
                Acesso exclusivo a informações sensíveis da loja.
            </p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="p-4 rounded-4 border">
                <h6 class="fw-bold">Link público da loja</h6>
                <input
                    type="text"
                    class="form-control"
                    value="{{ public_url }}"
                    readonly
                >
            </div>
        </div>

        <div class="col-md-6">
            <div class="p-4 rounded-4 border">
                <h6 class="fw-bold">Relatórios e Financeiro</h6>
                <p class="text-muted small mb-0">
                    Área reservada ao proprietário.
                </p>
            </div>
        </div>
    </div>
</div>
{% endif %}
