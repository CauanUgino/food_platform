<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativar Loja | COMAÍ - Comece a Vender Hoje!</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- TODO CSS EXATO QUE VOCÊ JÁ TEM - cola aqui -->
<style>
/* Cole aqui TODO o CSS da página de ativação que já funcionava */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; /* ... resto do CSS ... */ }
/* Mantenha 100% igual ao que já testou! */

/* Adicione só isso no final do CSS: */
.loading-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
  background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center;
  z-index: 9999; backdrop-filter: blur(10px);
}
.loading-content { 
  background: white; padding: 2.5rem; border-radius: 24px; text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.3); max-width: 400px; width: 90%;
}
.loading-spinner {
  width: 60px; height: 60px; border: 4px solid #f3f4f6; border-top: 4px solid #25D366;
  border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1.5rem;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.success-toast {
  position: fixed; top: 2rem; right: 2rem; background: linear-gradient(135deg, #25D366, #20b450);
  color: white; padding: 1.2rem 1.8rem; border-radius: 16px; box-shadow: 0 16px 40px rgba(37,211,102,0.4);
  transform: translateX(100%); transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94); z-index: 10000;
  font-weight: 600;
}
.success-toast.show { transform: translateX(0); }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loading">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <strong style="color: #1e293b; font-size: 1.1rem;">Enviando comprovante...</strong><br>
    <small style="color: #64748b;">Seu PartnerPayment foi criado com sucesso</small>
  </div>
</div>

<!-- SUCCESS TOAST -->
<div class="success-toast" id="toast">
  <i class="fas fa-check-circle"></i> Comprovante enviado! Aguarde aprovação no painel.
</div>

<!-- CONTEÚDO DA PÁGINA (100% IGUAL) -->
<div class="container">
  <div class="card">
    <!-- Hero, Plan, PIX - TUDO IGUAL -->
    <div class="hero">
      <div class="logo">COMAÍ</div>
      <h1 class="hero-title">Ative sua vitrine agora!</h1>
      <p class="subtitle">Plano Parceiro R$49/mês - Pagamento único para 30 dias</p>
      <!-- benefits... -->
    </div>

    <!-- PIX AREA -->
    <div class="pix-area">
      <div class="pix-label"><i class="fab fa-pix"></i> Chave PIX</div>
      <div class="pix-box" onclick="copyPix()">
        <span id="pixKey">comaioficial@gmail.com</span>
        <button class="copy-btn" onclick="event.stopPropagation(); copyPix();">
          <i class="fas fa-copy"></i> Copiar
        </button>
      </div>
      <div class="copied" id="copiedMsg">✅ PIX copiado!</div>
    </div>

    <!-- UPLOAD -->
    <div class="upload">
      <label><i class="fas fa-upload"></i> Comprovante PIX</label>
      <label class="file-box" for="proofFile">
        <i class="fas fa-cloud-upload-alt"></i> Arraste ou clique
      </label>
      <input type="file" id="proofFile" accept="image/*,.pdf" onchange="showFile(event)">
      <div class="file-name" id="fileName"></div>
    </div>

    <!-- BOTÃO QUE CHAMA SUA VIEW -->
    <button class="submit-btn" onclick="enviarComprovante()">
      <i class="fas fa-paper-plane"></i> Enviar para Validação
    </button>

    <!-- Trust badges... -->
  </div>
</div>

<script>
// ✅ VARIÁVEL GLOBAL DO ARQUIVO
let arquivoSelecionado = null;

// Copiar PIX (mantido)
function copyPix() {
  navigator.clipboard.writeText('comaioficial@gmail.com').then(() => {
    document.getElementById('copiedMsg').classList.add('show');
    setTimeout(() => document.getElementById('copiedMsg').classList.remove('show'), 2500);
  });
}

// Mostra arquivo selecionado
function showFile(e) {
  arquivoSelecionado = e.target.files[0];
  if (arquivoSelecionado) {
    document.getElementById('fileName').textContent = `✅ ${arquivoSelecionado.name}`;
    document.getElementById('fileName').style.display = 'block';
  }
}

// 🔥 FUNÇÃO PRINCIPAL - CHAMA SUA VIEW
async function enviarComprovante() {
  if (!arquivoSelecionado) {
    alert('⚠️ Selecione o comprovante primeiro!');
    return;
  }

  // Loading ON
  document.getElementById('loading').style.display = 'flex';

  try {
    // FormData EXATAMENTE como sua view espera
    const formData = new FormData();
    formData.append('proof', arquivoSelecionado);  // Nome exato!

    // Chama sua URL: pagamento/enviar/
    const response = await fetch('/pagamento/enviar/', {
      method: 'POST',
      body: formData,
      headers: {
        'X-CSRFToken': getCSRFToken()
      }
    });

    // Sucesso - sua view redireciona
    document.getElementById('loading').style.display = 'none';
    document.getElementById('toast').classList.add('show');
    
    // Redireciona para login (como sua view faz)
    setTimeout(() => {
      window.location.href = '/login/';
    }, 2500);

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    alert('❌ Erro na conexão. Tente novamente.');
  }
}

// CSRF Token Django
function getCSRFToken() {
  return document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
         document.cookie.match(/csrftoken=([^;]+)/)?.[1];
}

// Drag & Drop
document.querySelector('.file-box').addEventListener('dragover', e => {
  e.preventDefault(); e.currentTarget.style.borderColor = '#ea1d2c';
});
document.querySelector('.file-box').addEventListener('dragleave', e => {
  e.preventDefault(); e.currentTarget.style.borderColor = '#cbd5e1';
});
document.querySelector('.file-box').addEventListener('drop', e => {
  e.preventDefault(); e.currentTarget.style.borderColor = '#cbd5e1';
  document.getElementById('proofFile').files = e.dataTransfer.files;
  showFile({target: document.getElementById('proofFile')});
});
</script>
</body>
</html>
