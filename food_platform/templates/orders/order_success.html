{% extends "base.html" %} {% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; padding: 20px;">
    
    <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%;">
        
        <div style="width: 80px; height: 80px; background-color: #28a745; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px;">
            ✓
        </div>

        <h1 style="color: #333; font-size: 28px; margin-bottom: 10px; font-weight: 800;">Pedido Confirmado! 🎉</h1>
        <p style="color: #666; margin-bottom: 30px;">Obrigado por apoiar um negócio local através do <strong>COMAÍ</strong>.</p>

        <hr style="border: 0; border-top: 1px dashed #ddd; margin-bottom: 25px;">

        <div style="text-align: left; background: #fdfdfd; padding: 20px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 30px;">
            <p style="margin: 5px 0; color: #555;"><strong>Número do pedido:</strong> <span style="color: #ea1d2c;">#{{ order.id }}</span></p>
            <p style="margin: 5px 0; color: #555;"><strong>Status:</strong> <span style="background: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 4px; font-size: 0.9em;">{{ order.status }}</span></p>
            <p style="margin: 5px 0; color: #333; font-size: 1.2em;"><strong>Total:</strong> R$ {{ order.total }}</p>
        </div>

        <a href="{% url 'home' %}" style="display: block; background-color: #ea1d2c; color: white; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: 700; transition: 0.3s; box-shadow: 0 4px 15px rgba(234, 29, 44, 0.3);">
            Voltar para o Início
        </a>
        
        <p style="margin-top: 20px; font-size: 0.85em; color: #999;">O empreendedor já foi notificado!</p>
    </div>
</div>
{% endblock %}
