<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | COMAÍ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ea1d2c;
            --dark: #0f1111;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Animação de fundo degradê */
            background: linear-gradient(-45deg, #fff5f5, #f8f9fc, #fff0f1, #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Branding com efeito de flutuação */
        .hero-brand {
            padding: 50px 0 20px;
            text-align: center;
            animation: fadeInDown 1s;
        }

        .brand-text {
            font-weight: 800;
            font-size: 2.8rem;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #1a1a1a, #ea1d2c, #1a1a1a);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Card com Glassmorphism e entrada animada */
        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .premium-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 45px;
            animation: backInUp 1s cubic-bezier(0.26, 0.53, 0.74, 1.48);
        }

        /* Efeito nos Inputs */
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .form-control-pill {
            padding: 15px 15px 15px 50px;
            border-radius: 18px;
            border: 2px solid #edf2f7;
            background: white;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control-pill:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(234, 29, 44, 0.1);
            transform: translateX(5px);
        }

        .input-group-custom i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            transition: 0.3s;
        }

        .form-control-pill:focus + i {
            color: var(--primary);
        }

        /* Botão Pulsante */
        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 16px;
            font-weight: 700;
            width: 100%;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-main:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(234, 29, 44, 0.3);
        }

        .btn-main:active { transform: scale(0.98); }

        /* Botões de Opção com efeito Glow */
        .reg-option {
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            padding: 12px;
            text-decoration: none;
            color: #4a5568;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .reg-option:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #fff;
            box-shadow: 0 5px 15px rgba(234, 29, 44, 0.05);
        }

        /* Footer Animado */
        footer {
            background: white;
            border-top: 1px solid #f1f5f9;
            padding: 40px 0;
            animation: fadeIn 2s;
        }

        .social-circle:hover {
            transform: translateY(-5px) rotate(360deg);
            background: var(--primary);
            color: white;
        }

        .social-circle {
            transition: all 0.5s ease;
            display: inline-flex;
            width: 35px; height: 35px;
            background: #f8fafc;
            border-radius: 50%;
            align-items: center; justify-content: center;
            margin: 0 5px;
            color: #4a5568;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header class="hero-brand">
        <div class="brand-text animate__animated animate__pulse animate__infinite animate__slower">
             COMAÍ
        </div>
        <p class="text-muted small fw-600">Onde a tecnologia encontra o sabor</p>
    </header>

    <main class="login-section">
        <div class="premium-card">
            <div class="text-center mb-5">
                <h2 class="fw-800 h4 mb-2">Bem-vindo</h2>
                <p class="text-muted small">Entre para gerenciar seu império</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger border-0 small py-3 mb-4 rounded-4 animate__animated animate__shakeX">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> Credenciais incorretas.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="input-group-custom">
                    <input type="text" name="username" class="form-control form-control-pill" placeholder="Seu usuário" autofocus>
                    <i class="bi bi-person-fill"></i>
                </div>

                <div class="input-group-custom mb-5">
                    <input type="password" name="password" class="form-control form-control-pill" placeholder="Sua senha">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>

                <button type="submit" class="btn btn-main mb-4">
                    ACESSAR AGORA
                </button>
            </form>

            <div class="row g-2 mt-2">
                <div class="col-6">
                    <a href="{% url 'register_user' %}" class="reg-option">
                        <i class="bi bi-person"></i> Cliente
                    </a>
                </div>
                <div class="col-6">
                    <a href="{% url 'register_superuser' %}" class="reg-option">
                        <i class="bi bi-shop"></i> Gestor
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container">
            <div class="social-icons mb-3">
                <a href="#" class="social-circle"><i class="bi bi-instagram"></i></a>
                <a href="#" class="social-circle"><i class="bi bi-facebook"></i></a>
                <a href="#" class="social-circle"><i class="bi bi-twitter-x"></i></a>
            </div>
            <p class="text-muted extra-small mb-0">
                &copy; {{ now|date:"Y" }} <strong>COMAÍ</strong> | Desenvolvido por Cauan Ugino Filho.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
